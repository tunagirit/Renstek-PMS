  openDlg(`${dhead(ic('build', 'l'), id ? 'Bakım kaydı' : 'Bakım planla', id ? `${m.id} · ${mtStatus(m) === 'done' ? 'Tamamlandı' : mtStatus(m) === 'active' ? 'Devam ediyor' : 'Planlı'}` : 'Seçilen tarihlerde odalar satışa kapanır')}
    <div class="grid" style="gap:12px">
      <div class="tf"><label>Odalar — örn. 305, 601-604</label><input id="mtRooms" data-in="mtRooms" value="${m.rooms.length ? roomsLabel(m.rooms).replace(/–/g, '-') : ''}" placeholder=" "></div>
      <div class="grid g2" style="gap:12px"><div class="tf"><label>Başlangıç (dahil)</label><input type="date" id="mtFrom" data-in="mtFrom" value="${m.from}"></div><div class="tf"><label>Bitiş (dahil)</label><input type="date" id="mtTo" data-in="mtTo" value="${m.to}" min="${m.from}"></div></div>
      <div class="grid g2" style="gap:12px"><div class="tf"><label>Kategori</label><select id="mtCat">${Object.keys(MCAT).map(c => `<option ${m.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="tf"><label>Sorumlu</label><select id="mtWho"><option value="">Atanmadı</option>${tech.map(s => `<option value="${s.id}" ${m.who === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div></div>
      <div class="tf"><label>Açıklama</label><input id="mtReason" value="${esc(m.reason)}" placeholder=" "></div>
      <div><div class="muted" style="font-size:12.5px;margin-bottom:6px">Öncelik</div><div class="seg" id="mtPrio">${Object.entries(PRIO).map(([k, v]) => `<button class="${m.prio === k ? 'on' : ''}" data-a="mtPrio" data-v="${k}">${v.n}</button>`).join('')}</div></div>
    </div>
    <div id="mtConf"></div>
    <div class="dfoot">${id ? `<button class="btn btn-text" data-a="delMt" data-id="${id}" style="color:var(--error)">${ic('trash', 's')} Sil</button><span class="spacer"></span>${m.status !== 'done' ? `<button class="btn btn-ok" data-a="doneMt" data-id="${id}">${ic('check', 's')} Tamamlandı</button>` : ''}` : '<span class="spacer"></span>'}
      <button class="btn btn-text" data-a="close">Vazgeç</button><button class="btn btn-filled" data-a="saveMt">${id ? 'Kaydet' : 'Planla'}</button></div>`, true);
  mtConfRender();
}
function mtConfRender() {
  const d = UI.mtDraft, box = $('#mtConf'); if (!box) return;
  const rooms = parseRooms($('#mtRooms').value), from = $('#mtFrom').value, to = $('#mtTo').value;
  if (!rooms.length || !from || !to || to < from) { box.innerHTML = `<div class="sec muted" style="font-size:13px">${!rooms.length ? 'Geçerli bir oda numarası girin.' : 'Bitiş tarihi başlangıçtan önce olamaz.'}</div>`; return; }
  const c = S.res.filter(r => live(r) && rooms.includes(r.room) && r.in <= to && r.out > from);
  const lost = rooms.reduce((a, no) => { let t = 0; for (let x = from; x <= to; x = addDays(x, 1)) t += rate(room(no).type, x); return a + t; }, 0);
  box.innerHTML = `<div class="sec" style="${c.length ? 'background:var(--error-container);color:var(--on-error-container)' : ''}">
    <div class="between"><b>${rooms.length} oda · ${diff(from, to) + 1} gün · ${rooms.length * (diff(from, to) + 1)} oda-gece satışa kapanacak</b><span class="num" style="font-size:13px">≈ ${money(lost)}</span></div>
    ${c.length ? `<div style="margin-top:8px;font-size:13.5px">${ic('alert', 's')} ${c.length} rezervasyon bu tarihlerle çakışıyor:</div><div class="list" style="margin-top:4px">${c.slice(0, 6).map(r => `<div class="li" style="cursor:default;padding:6px"><div class="t"><b>${r.room} · ${esc(r.guest)}</b><span style="color:inherit;opacity:.8">${fmt(r.in)}–${fmt(r.out)} · ${ST[r.status].n}${findAlt(r, rooms) ? ' · uygun oda var' : ' · uygun oda yok!'}</span></div></div>`).join('')}${c.length > 6 ? `<div style="font-size:12.5px;padding:4px 6px">+${c.length - 6} rezervasyon daha</div>` : ''}</div>
      <label class="row" style="margin-top:10px;cursor:pointer;flex-wrap:nowrap"><input type="checkbox" class="cb" id="mtMove" checked> <span>Kaydederken çakışan misafirleri aynı tipte (yoksa en yakın) boş odalara taşı</span></label>` : `<div class="muted" style="font-size:12.5px;margin-top:4px">${ic('check', 'xs')} Çakışan rezervasyon yok.</div>`}</div>`;
}

/* =====================================================================
   İŞLEMLER
   ===================================================================== */
function relocate(r, avoid = []) {
  const alt = findAlt(r, avoid); if (!alt) return false;
  const from = r.room; r.room = alt.no; log(`${esc(r.guest)} ${from} → ${alt.no} odasına taşındı (bakım)`, 'swap'); return alt.no;
}
function afterChange(msg) { save(); if (msg) toast(msg); render(); }
const A = {
  go: t => { if (t.dataset.new) { UI.sel.clear(); } go(t.dataset.p); },
  rail: () => $('#app').classList.toggle('collapsed'),
  theme: () => { S.theme = S.theme === 'auto' ? 'light' : S.theme === 'light' ? 'dark' : 'auto'; applyTheme(); save(); toast('Tema: ' + { auto: 'Otomatik', light: 'Açık', dark: 'Karanlık' }[S.theme]); if (UI.page === 'ayarlar') render(); },
  close: () => closeDlg(),
  // kroki
  step: t => { const k = t.dataset.k, v = +t.dataset.v; UI.q[k] = k === 'ad' ? clamp(UI.q.ad + v, 1, 30) : clamp(UI.q.ch + v, 0, 20); render(); },
  feat: t => { const k = t.dataset.k; UI.q.feats.has(k) ? UI.q.feats.delete(k) : UI.q.feats.add(k); render(); },
  floor: t => { UI.floor = +t.dataset.f; UI.enter = true; render(); },
  proom: t => { const no = +t.dataset.no, k = t.dataset.k;
    if (k === 'sel') { UI.sel.delete(no); render(); return; }
    if (k === 'busy') { const r = resOn(no, UI.q.in, UI.q.out)[0]; if (r) resDlg(r.id); return; }
    if (k === 'mt') { const m = mtOn(no, UI.q.in, UI.q.out)[0]; if (m) mtDlg(m.id); return; }
    if (t.classList.contains('dim')) { toast('Bu oda seçili filtrelere uymuyor'); return; }
    UI.sel.add(no); render(); },
  unsel: t => { UI.sel.delete(+t.dataset.no); render(); },
  book: () => {
    const bf = UI.bf || {}, name = (bf.name || '').trim();
    if (!name) { toast('Misafir adını girin'); $('#bName')?.focus(); return; }
    const q = UI.q, sel = [...UI.sel].map(room).sort((a, b) => a.no - b.no);
    const bad = sel.find(r => !isFree(r.no, q.in, q.out)); if (bad) { toast(`${bad.no} artık müsait değil`); UI.sel.delete(bad.no); render(); return; }
    let ad = q.ad, ch = q.ch, paidLeft = +bf.paid || 0;
    sel.forEach((r, i) => { const left = sel.length - i, a = clamp(Math.ceil(ad / left), 1, S.types[r.type].cap), c = Math.min(Math.ceil(ch / left), Math.max(0, S.types[r.type].cap - a)); ad -= a; ch -= c;
      const total = stayPrice(r.type, q.in, q.out, a, c, q.board), paid = Math.min(total, paidLeft); paidLeft -= paid;
      S.res.push({ id: 'R' + (S.seq++), room: r.no, in: q.in, out: q.out, guest: name, phone: bf.phone || '', email: '', nat: bf.nat || 'TR', ad: a, ch: c, board: q.board, channel: bf.ch || 'Direkt', status: 'confirmed', total, paid, note: bf.note || '', created: Date.now() }); });
    log(`Yeni rezervasyon: ${name}, ${sel.map(r => r.no).join(', ')} (${diff(q.in, q.out)} gece)`, 'book');
    UI.sel.clear(); UI.bf = {}; closeDlg(); afterChange(`${sel.length} oda rezerve edildi · ${name}`);
  },
  newres: () => go('kroki'),
  bookDlg: () => bookDlg(),
  clearSel: () => { UI.sel.clear(); render(); },
  // takvim
  tfloor: t => { UI.tapeFloor = t.dataset.f === 'ALL' ? 'ALL' : +t.dataset.f; UI.enter = true; render(); },
  tnav: t => { const v = +t.dataset.v; UI.tapeStart = v === 0 ? addDays(TODAY, -3) : addDays(UI.tapeStart, v); render(); },
  cell: t => { const no = +t.dataset.no, d = t.dataset.d;
    const r = S.res.find(x => x.room === no && earning(x) && x.in <= d && x.out > d); if (r) { resDlg(r.id); return; }
    const m = mtDay(no, d); if (m) { mtDlg(m.id); return; }
    UI.q.in = d; UI.q.out = addDays(d, Math.max(1, diff(UI.q.in, UI.q.out) || 2)); if (UI.q.out <= d) UI.q.out = addDays(d, 2);
    UI.sel.clear(); if (isFree(no, UI.q.in, UI.q.out)) UI.sel.add(no); UI.floor = room(no).floor; go('kroki'); },
  // rezervasyon
  res: t => resDlg(t.dataset.id),
  ci: t => { const r = S.res.find(x => x.id === t.dataset.id); if (mtDay(r.room, TODAY)) { toast(`${r.room} bakımda — önce odayı değiştirin`); resDlg(r.id); return; }
    r.status = 'inhouse'; log(`${r.guest} ${r.room} odasına giriş yaptı`, 'in'); closeDlg(); afterChange(`${r.guest} · ${r.room} giriş yaptı${room(r.room).hk === 'dirty' ? ' (oda kirli görünüyor!)' : ''}`); },
  co: t => { const r = S.res.find(x => x.id === t.dataset.id); const bal = r.total - r.paid;
    r.status = 'out'; if (r.out > TODAY) r.out = TODAY > r.in ? TODAY : addDays(r.in, 1); room(r.room).hk = 'dirty'; log(`${r.guest} ${r.room} odasından çıkış yaptı`, 'out'); closeDlg(); afterChange(`${r.guest} çıkış yaptı · oda kirliye alındı${bal > 0 ? ' · ' + money(bal) + ' bakiye açık!' : ''}`); },
  cancel: t => { const r = S.res.find(x => x.id === t.dataset.id); r.status = 'cancelled'; log(`${r.id} (${r.guest}) iptal edildi`, 'ban'); closeDlg(); afterChange('Rezervasyon iptal edildi'); },
  noshow: t => { const r = S.res.find(x => x.id === t.dataset.id); r.status = 'noshow'; log(`${r.guest} gelmedi (no-show)`, 'ban'); closeDlg(); afterChange('Gelmedi olarak işaretlendi'); },
  pay: t => { const r = S.res.find(x => x.id === t.dataset.id), v = Math.max(0, +$('#payAmt').value || 0); r.paid = Math.min(r.total, r.paid + v); log(`${r.guest}: ${money(v)} tahsil edildi`, 'money'); save(); toast(money(v) + ' tahsil edildi'); render(); resDlg(r.id); },
  redate: t => { const r = S.res.find(x => x.id === t.dataset.id), a = $('#edIn').value, b = $('#edOut').value;
    if (!a || !b || b <= a) { toast('Geçerli bir tarih aralığı seçin'); return; }
    if (!isFree(r.room, a, b, r.id)) { toast(`${r.room} bu tarihlerde dolu ya da bakımda`); return; }
    r.in = a; r.out = b; r.total = stayPrice(room(r.room).type, a, b, r.ad, r.ch, r.board); log(`${r.guest}: tarih ${fmt(a)}–${fmt(b)} olarak güncellendi`, 'cal'); save(); render(); resDlg(r.id); toast('Tarihler güncellendi · yeni tutar ' + money(r.total)); },
  move: t => { const r = S.res.find(x => x.id === t.dataset.id), from = r.room; r.room = +t.dataset.no; log(`${r.guest} ${from} → ${r.room} odasına taşındı`, 'swap'); save(); render(); resDlg(r.id); toast(`${from} → ${r.room}`); },
  vipRes: t => { const r = S.res.find(x => x.id === t.dataset.id), k = key(r.guest, r.phone); S.vip[k] ? delete S.vip[k] : S.vip[k] = true; save(); render(); resDlg(r.id); },
  rezWhen: t => { UI.rez.when = t.dataset.v; UI.rez.limit = 80; render(); },
  rezSt: t => { UI.rez.st = t.dataset.v; UI.rez.limit = 80; render(); },
  more: () => { UI.rez.limit += 120; render(); },
  // odalar
  room: t => roomDlg(t.dataset.no),
  bulk: (t, e) => { e.stopPropagation(); const no = +t.dataset.no; UI.rooms.bulk.has(no) ? UI.rooms.bulk.delete(no) : UI.rooms.bulk.add(no); render(); },
  bulkAll: (t, e) => { e.stopPropagation(); const f = UI.rooms; const list = $$('input[data-a="bulk"]').map(x => +x.dataset.no); const all = list.every(n => f.bulk.has(n)); list.forEach(n => all ? f.bulk.delete(n) : f.bulk.add(n)); render(); },
  bulkClear: () => { UI.rooms.bulk.clear(); render(); },
  bulkMt: () => mtDlg(null, { rooms: [...UI.rooms.bulk] }),
  bulkType: () => openDlg(`${dhead(ic('bed', 'l'), 'Tip değiştir', UI.rooms.bulk.size + ' oda')}<div class="tf"><label>Yeni tip</label><select id="bkType">${Object.entries(S.types).map(([k, v]) => `<option value="${k}">${v.n}</option>`).join('')}</select></div><div class="dfoot"><button class="btn btn-text" data-a="close">Vazgeç</button><button class="btn btn-filled" data-a="bulkTypeSave">Uygula</button></div>`),
  bulkTypeSave: () => { const k = $('#bkType').value; UI.rooms.bulk.forEach(no => room(no).type = k); log(`${UI.rooms.bulk.size} odanın tipi ${S.types[k].n} yapıldı`, 'bed'); UI.rooms.bulk.clear(); closeDlg(); afterChange('Oda tipleri güncellendi'); },
  rmFeat: t => t.classList.toggle('on'),
  rmHk: t => { room(t.dataset.no).hk = t.dataset.v; save(); render(); roomDlg(t.dataset.no); },
  saveRoom: t => { const r = room(t.dataset.no); r.type = $('#rmType').value; r.note = $('#rmNote').value.trim(); r.feats = $$('#rmFeats .chip.on').map(c => c.dataset.k); log(`${r.no} numaralı oda güncellendi`, 'edit'); closeDlg(); afterChange('Oda kaydedildi'); },
  bookRoom: t => { const no = +t.dataset.no, r = room(no); closeDlg(); UI.floor = r.floor; if (isFree(no, UI.q.in, UI.q.out)) { UI.sel.add(no); go('kroki'); } else { go('kroki'); toast(`${no} seçili tarihlerde müsait değil — tarihleri değiştirin`); } },
  // bakım
  mt: t => mtDlg(t.dataset.id),
  newmt: t => mtDlg(null, t && t.dataset.rooms ? { rooms: [+t.dataset.rooms] } : {}),
  mtTab: t => { UI.mt = t.dataset.v; render(); },
  mtPrio: t => { UI.mtDraft.prio = t.dataset.v; $$('#mtPrio button').forEach(b => b.classList.toggle('on', b === t)); },
  saveMt: () => {
    const d = UI.mtDraft, rooms = parseRooms($('#mtRooms').value), from = $('#mtFrom').value, to = $('#mtTo').value;
    if (!rooms.length) { toast('Geçerli oda numarası girin'); return; }
    if (!from || !to || to < from) { toast('Tarih aralığını kontrol edin'); return; }
    const data = { rooms, from, to, cat: $('#mtCat').value, who: $('#mtWho').value, reason: $('#mtReason').value.trim() || $('#mtCat').value, prio: d.prio };
    let m;
    if (d.id) { m = S.maint.find(x => x.id === d.id); Object.assign(m, data); if (m.status === 'done' && to >= TODAY) m.status = 'planned'; }
    else { m = { id: 'M' + (S.seq++), ...data, status: 'planned', note: '', created: Date.now() }; S.maint.push(m); }
    let moved = 0, stuck = 0;
    if ($('#mtMove')?.checked) mtConflicts(m).forEach(r => relocate(r, rooms) ? moved++ : stuck++);
    log(`Oda ${roomsLabel(rooms)} için bakım ${d.id ? 'güncellendi' : 'planlandı'} (${fmt(from)}–${fmt(to)})`, 'build');
    UI.sel.forEach(no => { if (rooms.includes(no)) UI.sel.delete(no); });
    closeDlg(); afterChange(`Bakım ${d.id ? 'güncellendi' : 'planlandı'}${moved ? ` · ${moved} misafir taşındı` : ''}${stuck ? ` · ${stuck} rezervasyon için boş oda bulunamadı` : ''}`);
  },
  doneMt: t => { const m = S.maint.find(x => x.id === t.dataset.id); m.status = 'done'; if (m.to > TODAY) m.to = TODAY < m.from ? m.from : TODAY; m.rooms.forEach(no => room(no).hk = 'inspect'); log(`Oda ${roomsLabel(m.rooms)} bakımı tamamlandı`, 'check'); closeDlg(); afterChange('Bakım tamamlandı · odalar kontrole gönderildi'); },
  delMt: t => { S.maint = S.maint.filter(x => x.id !== t.dataset.id); log('Bir bakım kaydı silindi', 'trash'); closeDlg(); afterChange('Bakım kaydı silindi'); },
  fixOne: (t, e) => { e.stopPropagation(); const r = S.res.find(x => x.id === t.dataset.id); const mrooms = S.maint.filter(m => m.status !== 'done' && m.rooms.includes(r.room)).flatMap(m => m.rooms); const to = relocate(r, mrooms); afterChange(to ? `${r.guest} ${to} odasına taşındı` : 'Bu tarihler için uygun boş oda yok'); },
  fixAll: () => { let ok = 0, no = 0; openMaintConflicts().forEach(({ m, r }) => relocate(r, m.rooms) ? ok++ : no++); afterChange(`${ok} misafir taşındı${no ? ` · ${no} rezervasyon için oda bulunamadı` : ''}`); },
  // kat hizmetleri
  hkFloor: t => { UI.hkFloor = t.dataset.f === 'ALL' ? 'ALL' : +t.dataset.f; UI.enter = true; render(); },
  hk: t => { const r = room(t.dataset.no); if (mtDay(r.no, TODAY)) { mtDlg(mtDay(r.no, TODAY).id); return; } const order = ['dirty', 'inspect', 'clean', 'dnd']; r.hk = order[(order.indexOf(r.hk) + 1) % order.length]; save(); render(); },
  hkAllInspect: () => { let n = 0; S.rooms.forEach(r => { if (r.hk === 'inspect') { r.hk = 'clean'; n++; } }); log(`${n} oda kontrol edilip temize alındı`, 'check'); afterChange(n ? `${n} oda temiz olarak onaylandı` : 'Kontrol bekleyen oda yok'); },
  // fiyat
  wkToggle: () => { S.pricing.weekendOn = !S.pricing.weekendOn; afterChange(); },
  addSeason: () => { S.pricing.seasons.push({ id: uid('s'), name: 'Yeni sezon', from: TODAY, to: addDays(TODAY, 30), mult: 110 }); afterChange('Sezon eklendi'); },
  delSeason: t => { S.pricing.seasons = S.pricing.seasons.filter(s => s.id !== t.dataset.id); afterChange('Sezon silindi'); },
  // misafir
  vip: (t, e) => { e.stopPropagation(); const k = t.dataset.k; S.vip[k] ? delete S.vip[k] : S.vip[k] = true; afterChange(); },
  guest: t => { const k = t.dataset.k, list = S.res.filter(r => key(r.guest, r.phone) === k).sort((a, b) => a.in < b.in ? 1 : -1); const g = list[0];
    openDlg(`${dhead(avatar(g.guest), esc(g.guest), `${g.nat} · ${esc(g.phone)} · ${list.length} kayıt`)}<div class="list">${list.map(r => `<div class="li" data-a="res" data-id="${r.id}"><div class="t"><b>Oda ${r.room} · ${fmt(r.in)} – ${fmt(r.out)}</b><span>${r.board} · ${r.channel} · ${money(r.total)}</span></div><span class="tag ${ST[r.status].c}">${ST[r.status].n}</span></div>`).join('')}</div><div class="dfoot"><button class="btn btn-filled" data-a="close">Kapat</button></div>`); },
  // ayarlar
  stars: t => { S.hotel.stars = +t.dataset.v; afterChange(); },
  saveStruct: () => { const f = clamp(+$('#stF').value || 1, 1, 30), r = clamp(+$('#stR').value || 1, 1, 2), p = clamp(+$('#stP').value || 2, 2, 20);
    S.structure = { floors: f, rows: r, perRow: p }; S.rooms = buildRooms(S.structure, S.rooms); for (let i = 1; i <= f; i++) if (!S.hkFloor[i]) S.hkFloor[i] = S.staff.find(s => s.role === 'Oda görevlisi')?.id;
    UI.floor = clamp(UI.floor, 1, f); if (UI.tapeFloor !== 'ALL') UI.tapeFloor = clamp(UI.tapeFloor, 1, f); UI.sel.clear(); log(`Bina yapısı güncellendi: ${f} kat, ${S.rooms.length} oda`, 'plan'); afterChange(`Yapı güncellendi · ${S.rooms.length} oda`); },
  addStaff: () => { S.staff.push({ id: uid('p'), name: 'Yeni personel', role: 'Oda görevlisi' }); afterChange(); },
  delStaff: t => { S.staff = S.staff.filter(s => s.id !== t.dataset.id); afterChange('Personel silindi'); },
  setTheme: t => { S.theme = t.dataset.v; applyTheme(); afterChange(); },
  setMotion: t => { S.motion = t.dataset.v; applyMotion(); afterChange(); },
  export: () => { const txt = JSON.stringify(S); openDlg(`${dhead(ic('copy', 'l'), 'Dışa aktar', Math.round(txt.length / 1024) + ' KB veri')}<div class="tf"><label>Yedek (JSON)</label><textarea id="expTxt" rows="8" readonly>${esc(txt)}</textarea></div><div class="dfoot"><button class="btn btn-text" data-a="close">Kapat</button><button class="btn btn-filled" data-a="copyExp">${ic('copy', 's')} Kopyala</button></div>`); },
  copyExp: () => { const t = $('#expTxt'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Panoya kopyalandı'), () => { try { document.execCommand('copy'); toast('Panoya kopyalandı'); } catch (e) { toast('Metni seçip kendiniz kopyalayın'); } }); },
  import: () => openDlg(`${dhead(ic('down', 'l'), 'İçe aktar', 'Mevcut verinin yerine geçer')}<div class="tf"><label>Yedek JSON'unu yapıştırın</label><textarea id="impTxt" rows="8"></textarea></div><div class="dfoot"><button class="btn btn-text" data-a="close">Vazgeç</button><button class="btn btn-filled" data-a="doImport">İçe aktar</button></div>`),
  doImport: () => { try { const d = JSON.parse($('#impTxt').value); if (!d.rooms || !d.res || !d.types) throw 0; S = d; save(); closeDlg(); applyTheme(); applyMotion(); UI.sel.clear(); go('panel'); toast('Veri içe aktarıldı'); } catch (e) { toast('Geçersiz yedek verisi'); } },
  reset: () => openDlg(`${dhead(ic('alert', 'l'), 'Demo veriye sıfırla', 'Tüm rezervasyonlar, bakım kayıtları ve ayarlar silinir')}<div class="muted">Bu işlem geri alınamaz. Önce “Dışa aktar” ile yedek almanız önerilir.</div><div class="dfoot"><button class="btn btn-text" data-a="close">Vazgeç</button><button class="btn btn-err" data-a="doReset">Sıfırla</button></div>`),
  doReset: () => { const th = S.theme, mo = S.motion; S = seed(); S.theme = th; S.motion = mo; save(); closeDlg(); UI.sel.clear(); go('panel'); toast('Demo veri yüklendi'); }
};

/* ---------- input olayları ---------- */
const IN = {
  qIn: v => { if (!v) return; UI.q.in = v; if (UI.q.out <= v) UI.q.out = addDays(v, 1); pruneSel(); render(); },
  qOut: v => { if (!v) return; UI.q.out = v <= UI.q.in ? addDays(UI.q.in, 1) : v; pruneSel(); render(); },
  qBoard: v => { UI.q.board = v; render(); }, qType: v => { UI.q.type = v; render(); },
  bName: v => bf('name', v), bPhone: v => bf('phone', v), bNat: v => bf('nat', v), bCh: v => bf('ch', v), bPaid: v => bf('paid', v), bNote: v => bf('note', v),
  rezQ: v => { UI.rez.q = v; UI.rez.limit = 80; debounce(render); },
  roomQ: v => { UI.rooms.q = v; debounce(render); }, roomFloor: v => { UI.rooms.floor = v; render(); }, roomType: v => { UI.rooms.type = v; render(); }, roomFeat: v => { UI.rooms.feat = v; render(); },
  mtRooms: () => mtConfRender(), mtFrom: v => { $('#mtTo').min = v; if ($('#mtTo').value < v) $('#mtTo').value = v; mtConfRender(); }, mtTo: () => mtConfRender(),
  hkStaff: (v, t) => { S.hkFloor[t.dataset.f] = v; save(); toast(`${t.dataset.f}. kat: ${staff(v)?.name}`); },
  typeName: (v, t) => { S.types[t.dataset.k].n = v || t.dataset.k; save(); }, typeCap: (v, t) => { S.types[t.dataset.k].cap = clamp(+v || 1, 1, 12); save(); },
  typeBase: (v, t) => { S.types[t.dataset.k].base = Math.max(0, +v || 0); save(); debounce(render, 500); },
  wkPct: v => { S.pricing.weekendPct = clamp(+v || 0, 0, 200); save(); debounce(render, 500); }, childPct: v => { S.pricing.childPct = clamp(+v || 0, 0, 100); save(); },
  boardP: (v, t) => { S.pricing.board[t.dataset.k] = Math.max(0, +v || 0); save(); },
  sName: (v, t) => { ssn(t).name = v; save(); }, sFrom: (v, t) => { ssn(t).from = v; save(); render(); }, sTo: (v, t) => { ssn(t).to = v; save(); render(); }, sMult: (v, t) => { ssn(t).mult = clamp(+v || 100, 10, 500); save(); debounce(render, 500); },
  priceType: v => { UI.priceType = v; UI.enter = true; render(); },
  gQ: v => { UI.guests.q = v; debounce(render); },
  hName: v => { S.hotel.name = v || 'Otel'; save(); renderRail(); }, hCity: v => { S.hotel.city = v; save(); }, hCin: v => { S.hotel.cin = v; save(); }, hCout: v => { S.hotel.cout = v; save(); },
  stName: (v, t) => { S.staff.find(s => s.id === t.dataset.id).name = v; save(); }, stRole: (v, t) => { S.staff.find(s => s.id === t.dataset.id).role = v; save(); }
};
const ssn = t => S.pricing.seasons.find(s => s.id === t.dataset.id);
function bf(k, v) { UI.bf = UI.bf || {}; UI.bf[k] = v; }
function pruneSel() { [...UI.sel].forEach(no => { if (!isFree(no, UI.q.in, UI.q.out)) UI.sel.delete(no); }); }
let dT; function debounce(fn, ms = 220) { clearTimeout(dT); dT = setTimeout(fn, ms); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  if (t.tagName === 'INPUT' && t.type === 'checkbox' && !['bulk', 'bulkAll'].includes(t.dataset.a)) return;
  const f = A[t.dataset.a]; if (f) { if (t.tagName === 'BUTTON' || t.tagName === 'A') e.preventDefault(); f(t, e); }
});
const onIn = e => { const t = e.target, k = t.dataset && t.dataset.in; if (k && IN[k]) IN[k](t.value, t); };
document.addEventListener('change', e => { const k = e.target.dataset?.in; if (k && !['rezQ','roomQ','gQ','bName','bPhone','bPaid','bNote','mtRooms','typeName','sName','stName','hName','hCity'].includes(k)) onIn(e); });
document.addEventListener('input', e => { const k = e.target.dataset?.in; if (k && ['rezQ','roomQ','gQ','bName','bPhone','bPaid','bNote','mtRooms','typeName','sName','stName','hName','hCity','typeBase','wkPct','sMult','childPct','boardP','typeCap'].includes(k)) onIn(e); });

/* ripple */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.ibtn,.navi,.chip,.hk'); if (!b || S.motion === 'off') return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, sp = document.createElement('span');
  sp.className = 'rip'; sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(sp); sp.addEventListener('animationend', () => sp.remove());
});

/* genel arama */
$('#gsearch').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const v = e.target.value.trim(); if (!v) return;
  if (/^\d{3,4}$/.test(v) && room(+v)) { roomDlg(+v); return; }
  const id = S.res.find(r => r.id.toLowerCase() === v.toLowerCase()); if (id) { resDlg(id.id); return; }
  UI.rez = { q: v, st: 'all', when: 'all', limit: 80 }; go('rezervasyonlar'); e.target.value = '';
});

/* responsive kroki üst satırı */
const fitKroki = () => { const g = $('#krokiTop'); if (g) g.style.gridTemplateColumns = innerWidth < 1100 ? '1fr' : 'minmax(0,1fr) 230px'; };
new MutationObserver(fitKroki).observe($('#page'), { childList: true });
addEventListener('resize', fitKroki);

/* ---------- başlat ---------- */
applyTheme(); applyMotion(); save();
UI.page = PAGES.find(p => p.id === location.hash.slice(1)) ? location.hash.slice(1) : 'panel';
render();
setTimeout(() => $('#splash').classList.add('gone'), S.motion === 'off' ? 50 : 850);
</script>
</body>
</html>
